[project]
name = "authn"
version = "0.1.0"
description = "Session + API-key authentication provider for ARC"
requires-python = ">=3.12"
dependencies = ["argon2-cffi", "zxcvbn", "typer>=0.12", "rich>=13.0"]

# register() — the runtime capability (arc.boot() discovers this).
[project.entry-points."arc.plugins"]
authn = "authn:register"

# arc authn create-user / ... — CLI tooling (arc.plugin_cli discovers this).
[project.entry-points."arc.plugins.cli"]
authn = "authn.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["authn"]
